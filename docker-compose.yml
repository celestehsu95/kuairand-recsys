x-app: &app
  build: .
  image: kuairand-recsys:latest
  environment:
    REDIS_HOST: redis
    KAFKA_BOOTSTRAP: kafka:9092
    ARTIFACTS_DIR: /app/artifacts
    FAISS_INDEX: ${FAISS_INDEX:-flat}
    RT_ALPHA: ${RT_ALPHA:-1.0}
    REPLAY_RATE: ${REPLAY_RATE:-300}
  volumes:
    - ${ARTIFACTS:-./artifacts}:/app/artifacts:ro
    - ./results:/app/results

services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 4
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      start_period: 10s
      retries: 30

  api:
    <<: *app
    command: ["sh", "-c", "uvicorn serving.app:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-2}"]
    ports: ["8000:8000"]
    restart: unless-stopped
    depends_on:
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      start_period: 30s
      retries: 20

  worker:
    <<: *app
    command: ["python", "-m", "serving.worker"]
    restart: unless-stopped
    depends_on:
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}

  replayer:
    <<: *app
    command: ["python", "-m", "serving.replayer"]
    profiles: ["replay"]
    depends_on:
      kafka: {condition: service_healthy}

  bootstrap:
    <<: *app
    command: ["python", "-m", "serving.bootstrap"]
    profiles: ["tools"]
    depends_on:
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
